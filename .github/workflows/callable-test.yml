name: '#Callable - Test'

on:
  workflow_call:
    inputs:
      with_coverage:
        type: boolean
        default: false
    secrets:
      machine_account_token:
        required: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        if: ${{ !inputs.with_coverage }}
        run: npm test

      - name: Run Coverage Tests
        if: ${{ inputs.with_coverage }}
        run: npm run test:coverage

      - name: Report Coverage
        if: ${{ inputs.with_coverage }}
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: coverage/lcov.info
          github-token: ${{ secrets.machine_account_token }}

      - name: Run Build
        run: npm run build

      - name: Run Package Linter
        run: npm run lint:package
