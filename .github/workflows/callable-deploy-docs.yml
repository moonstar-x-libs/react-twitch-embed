name: '#Callable - Deploy Docs'

on:
  workflow_call:
    inputs:
      docs_repo:
        type: string
        required: true
      docs_branch:
        type: string
        required: true
      commit_message:
        type: string
        required: true
    secrets:
      docs_machine_account_token:
        required: true

jobs:
  docs:
    name: Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Documentation
        run: npm run storybook:build

      - name: Deploy Documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.docs_machine_account_token }}
          external_repository: ${{ inputs.docs_repo }}
          publish_branch: ${{ inputs.docs_branch }}
          publish_dir: ./docs-build
          enable_jekyll: false
          allow_empty_commit: true
          commit_message: ${{ inputs.commit_message }}
